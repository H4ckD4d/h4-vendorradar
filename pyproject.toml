[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "h4-vendorradar"
version = "0.1.0"
description = "Supplier evidence and risk review"
requires-python = ">=3.11"
authors = [{name="Chris Cruz (@h4ckd4d)"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3", "pydantic>=2.8,<3", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
